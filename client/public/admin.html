<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Udyam Setu</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main" class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
  <h1 class="text-2xl md:text-3xl font-bold mb-1">Admin dashboard</h1>
  <p class="mb-6" style="color:var(--color-muted)">Verify entrepreneurs, manage scheme listings, and review platform coverage.</p>

  <div class="flex gap-2 mb-6 border-b" style="border-color:var(--color-border)">
    <button class="tab-btn btn btn-sm" data-tab="overview">Overview</button>
    <button class="tab-btn btn btn-sm" data-tab="entrepreneurs">Entrepreneurs</button>
    <button class="tab-btn btn btn-sm" data-tab="schemes">Schemes</button>
  </div>

  <!-- OVERVIEW -->
  <section id="tab-overview" class="tab-panel">
    <div id="statsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="card p-5 text-center"><div class="text-2xl font-extrabold" id="sTotal">—</div><div class="text-xs mt-1" style="color:var(--color-muted)">Total entrepreneurs</div></div>
      <div class="card p-5 text-center"><div class="text-2xl font-extrabold" style="color:var(--color-green)" id="sVerified">—</div><div class="text-xs mt-1" style="color:var(--color-muted)">Verified</div></div>
      <div class="card p-5 text-center"><div class="text-2xl font-extrabold" id="sCategories">—</div><div class="text-xs mt-1" style="color:var(--color-muted)">Categories</div></div>
      <div class="card p-5 text-center"><div class="text-2xl font-extrabold" id="sDistricts">—</div><div class="text-xs mt-1" style="color:var(--color-muted)">Districts covered</div></div>
    </div>
    <div class="card p-6">
      <h3 class="font-semibold mb-4" style="color:var(--color-ink)">Entrepreneurs by category</h3>
      <div id="categoryBreakdown" class="space-y-2 text-sm"></div>
    </div>
  </section>

  <!-- ENTREPRENEURS -->
  <section id="tab-entrepreneurs" class="tab-panel hidden">
    <div class="flex flex-wrap gap-3 mb-4">
      <input id="adminSearch" class="field-input max-w-xs" placeholder="Search business or entrepreneur...">
      <select id="adminStatusFilter" class="field-select max-w-xs">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="verified">Verified</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left" style="background:#F3F7F5;">
            <th class="p-3">Business</th>
            <th class="p-3">Category</th>
            <th class="p-3">District/State</th>
            <th class="p-3">Status</th>
            <th class="p-3">Actions</th>
          </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </section>

  <!-- SCHEMES -->
  <section id="tab-schemes" class="tab-panel hidden">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-semibold" style="color:var(--color-ink)">Manage schemes</h3>
      <button id="addSchemeBtn" class="btn btn-primary btn-sm">+ Add scheme</button>
    </div>
    <div id="schemesAdminList" class="space-y-4"></div>
  </section>
</main>

<!-- Scheme editor modal -->
<div id="schemeModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(14,46,48,0.55);">
  <div class="card p-6 w-full max-w-lg max-h-[85vh] overflow-y-auto">
    <h3 class="font-semibold mb-4" id="schemeModalTitle" style="color:var(--color-ink)">Add scheme</h3>
    <form id="schemeForm" class="space-y-3">
      <input type="hidden" id="schemeId">
      <div><label class="field-label">Name</label><input class="field-input" id="schemeName" required></div>
      <div><label class="field-label">Description</label><textarea class="field-textarea" id="schemeDescription" rows="2" required></textarea></div>
      <div><label class="field-label">Eligibility</label><input class="field-input" id="schemeEligibility"></div>
      <div><label class="field-label">Benefits</label><input class="field-input" id="schemeBenefits"></div>
      <div><label class="field-label">Documents required</label><input class="field-input" id="schemeDocuments"></div>
      <div><label class="field-label">Official URL (leave blank if unknown)</label><input class="field-input" id="schemeUrl"></div>
      <div>
        <label class="field-label">Relevant categories</label>
        <div id="schemeCategoryChecks" class="grid grid-cols-2 gap-1 text-sm"></div>
      </div>
      <div id="schemeFormError" class="field-error hidden"></div>
      <div class="flex gap-2 pt-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" id="closeSchemeModal" class="btn btn-outline">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
if (!Auth.isLoggedIn() || (Auth.getUser() && Auth.getUser().role !== 'admin')) {
  window.location.href = '/login.html';
}

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.classList.add('btn-outline');
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('btn-primary'));
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.add('btn-outline'));
    btn.classList.remove('btn-outline');
    btn.classList.add('btn-primary');
    document.querySelectorAll('.tab-panel').forEach((p) => p.classList.add('hidden'));
    document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');
  });
});
document.querySelector('.tab-btn[data-tab="overview"]').click();

// ---------- Overview ----------
async function loadStats() {
  try {
    const stats = await apiRequest('/admin/stats');
    document.getElementById('sTotal').textContent = stats.totalEntrepreneurs;
    document.getElementById('sVerified').textContent = stats.verifiedEntrepreneurs;
    document.getElementById('sCategories').textContent = stats.categoriesCount;
    document.getElementById('sDistricts').textContent = stats.districtsCovered;
    const breakdown = document.getElementById('categoryBreakdown');
    const entries = Object.entries(stats.categoryBreakdown);
    breakdown.innerHTML = entries.length
      ? entries.map(([cat, count]) => `
        <div class="flex items-center gap-3">
          <span class="w-40 shrink-0">${cat}</span>
          <div class="flex-1 h-2 rounded-full" style="background:var(--color-border)">
            <div class="h-2 rounded-full" style="background:var(--color-saffron); width:${Math.min(100, (count / stats.totalEntrepreneurs) * 100)}%"></div>
          </div>
          <span class="text-xs w-6 text-right" style="color:var(--color-muted)">${count}</span>
        </div>
      `).join('')
      : '<p style="color:var(--color-muted)">No data yet.</p>';
  } catch (err) {
    if (err.status === 401 || err.status === 403) { Auth.logout(); return; }
    showToast(err.message, 'error');
  }
}

// ---------- Entrepreneurs table ----------
let allEntrepreneurs = [];

function rowStatusBadge(status) {
  if (status === 'verified') return '<span class="badge badge-verified">Verified</span>';
  if (status === 'rejected') return '<span class="badge badge-rejected">Rejected</span>';
  return '<span class="badge badge-pending">Pending</span>';
}

function renderTable() {
  const search = document.getElementById('adminSearch').value.toLowerCase();
  const status = document.getElementById('adminStatusFilter').value;
  let rows = allEntrepreneurs;
  if (search) rows = rows.filter((e) => e.businessName.toLowerCase().includes(search) || e.entrepreneurName.toLowerCase().includes(search));
  if (status) rows = rows.filter((e) => e.verificationStatus === status);

  document.getElementById('adminTableBody').innerHTML = rows.map((e) => `
    <tr class="border-t" style="border-color:var(--color-border)">
      <td class="p-3">
        <a href="/profile.html?id=${e.id}" target="_blank" class="font-semibold hover:underline" style="color:var(--color-ink)">${e.businessName}</a>
        <p class="text-xs" style="color:var(--color-muted)">${e.entrepreneurName}</p>
      </td>
      <td class="p-3">${e.category}</td>
      <td class="p-3">${e.district}, ${e.state}</td>
      <td class="p-3">${rowStatusBadge(e.verificationStatus)}</td>
      <td class="p-3">
        <div class="flex flex-wrap gap-1">
          <button class="btn btn-green btn-sm" data-action="verify" data-id="${e.id}">Approve</button>
          <button class="btn btn-outline btn-sm" data-action="reject" data-id="${e.id}">Reject</button>
          <button class="btn btn-sm" style="background:#FBE9E7;color:#B3401F;" data-action="delete" data-id="${e.id}">Delete</button>
        </div>
      </td>
    </tr>
  `).join('') || `<tr><td colspan="5" class="p-6 text-center" style="color:var(--color-muted)">No entrepreneurs match.</td></tr>`;

  document.querySelectorAll('[data-action]').forEach((btn) => {
    btn.addEventListener('click', () => handleAction(btn.dataset.action, btn.dataset.id));
  });
}

async function handleAction(action, id) {
  try {
    if (action === 'verify') await apiRequest(`/entrepreneurs/${id}/verify`, { method: 'PUT', body: { status: 'verified' } });
    if (action === 'reject') await apiRequest(`/entrepreneurs/${id}/verify`, { method: 'PUT', body: { status: 'rejected' } });
    if (action === 'delete') {
      if (!confirm('Delete this entrepreneur profile permanently?')) return;
      await apiRequest(`/entrepreneurs/${id}`, { method: 'DELETE' });
    }
    showToast('Updated successfully', 'success');
    await loadEntrepreneurs();
    loadStats();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function loadEntrepreneurs() {
  try {
    // Fetch each verification status explicitly so admins see everything, including rejected profiles
    // (the public directory endpoint hides rejected profiles by default).
    const [pending, verified, rejected] = await Promise.all([
      apiRequest('/entrepreneurs?status=pending', { auth: false }),
      apiRequest('/entrepreneurs?status=verified', { auth: false }),
      apiRequest('/entrepreneurs?status=rejected', { auth: false }),
    ]);
    allEntrepreneurs = [...pending.entrepreneurs, ...verified.entrepreneurs, ...rejected.entrepreneurs];
    renderTable();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

document.getElementById('adminSearch').addEventListener('input', renderTable);
document.getElementById('adminStatusFilter').addEventListener('change', renderTable);

// ---------- Schemes management ----------
let allSchemes = [];

function schemeAdminCard(s) {
  return `
    <div class="card p-5">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <h4 class="font-semibold">${s.name}</h4>
          <p class="text-xs mt-1" style="color:var(--color-muted)">${s.categories.join(', ')}</p>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-outline btn-sm" data-edit="${s.id}">Edit</button>
          <button class="btn btn-sm" style="background:#FBE9E7;color:#B3401F;" data-delete="${s.id}">Delete</button>
        </div>
      </div>
      <p class="text-sm mt-2" style="color:var(--color-text)">${s.description}</p>
    </div>
  `;
}

async function loadSchemes() {
  try {
    const { schemes } = await apiRequest('/schemes', { auth: false });
    allSchemes = schemes;
    document.getElementById('schemesAdminList').innerHTML = schemes.map(schemeAdminCard).join('');
    document.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => openSchemeModal(b.dataset.edit)));
    document.querySelectorAll('[data-delete]').forEach((b) => b.addEventListener('click', () => deleteScheme(b.dataset.delete)));
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deleteScheme(id) {
  if (!confirm('Delete this scheme?')) return;
  try {
    await apiRequest(`/schemes/${id}`, { method: 'DELETE' });
    showToast('Scheme deleted', 'success');
    loadSchemes();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

const schemeCategoryChecks = document.getElementById('schemeCategoryChecks');
CATEGORIES.forEach((c) => {
  const id = `cat-${c.replace(/\s+/g, '-')}`;
  schemeCategoryChecks.innerHTML += `<label class="flex items-center gap-1"><input type="checkbox" value="${c}" id="${id}"> ${c}</label>`;
});

function openSchemeModal(id) {
  const modal = document.getElementById('schemeModal');
  document.getElementById('schemeFormError').classList.add('hidden');
  const scheme = id ? allSchemes.find((s) => s.id === id) : null;
  document.getElementById('schemeModalTitle').textContent = scheme ? 'Edit scheme' : 'Add scheme';
  document.getElementById('schemeId').value = scheme ? scheme.id : '';
  document.getElementById('schemeName').value = scheme ? scheme.name : '';
  document.getElementById('schemeDescription').value = scheme ? scheme.description : '';
  document.getElementById('schemeEligibility').value = scheme ? scheme.eligibility : '';
  document.getElementById('schemeBenefits').value = scheme ? scheme.benefits : '';
  document.getElementById('schemeDocuments').value = scheme ? scheme.documents : '';
  document.getElementById('schemeUrl').value = scheme ? scheme.officialUrl : '';
  CATEGORIES.forEach((c) => {
    const el = document.getElementById(`cat-${c.replace(/\s+/g, '-')}`);
    el.checked = scheme ? scheme.categories.includes(c) : false;
  });
  modal.classList.remove('hidden');
}

document.getElementById('addSchemeBtn').addEventListener('click', () => openSchemeModal(null));
document.getElementById('closeSchemeModal').addEventListener('click', () => document.getElementById('schemeModal').classList.add('hidden'));

document.getElementById('schemeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('schemeId').value;
  const categories = CATEGORIES.filter((c) => document.getElementById(`cat-${c.replace(/\s+/g, '-')}`).checked);
  const body = {
    name: document.getElementById('schemeName').value.trim(),
    description: document.getElementById('schemeDescription').value.trim(),
    eligibility: document.getElementById('schemeEligibility').value.trim(),
    benefits: document.getElementById('schemeBenefits').value.trim(),
    documents: document.getElementById('schemeDocuments').value.trim(),
    officialUrl: document.getElementById('schemeUrl').value.trim(),
    categories: categories.length ? categories : ['All'],
  };
  try {
    if (id) await apiRequest(`/schemes/${id}`, { method: 'PUT', body });
    else await apiRequest('/schemes', { method: 'POST', body });
    document.getElementById('schemeModal').classList.add('hidden');
    showToast('Scheme saved', 'success');
    loadSchemes();
  } catch (err) {
    const errEl = document.getElementById('schemeFormError');
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  }
});

loadStats();
loadEntrepreneurs();
loadSchemes();
</script>
</body>
</html>
